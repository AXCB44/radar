plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.radar.gta'
    compileSdk 34

    defaultConfig {
        applicationId "pl.radar.gta"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable false
        }
    }
}
